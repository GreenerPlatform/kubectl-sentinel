apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: sentinel
spec:
  version: {{ .TagName }}
  homepage: https://github.com/GreenerPlatform/kubectl-sentinel
  shortDescription: Deterministic cluster health snapshot for triage
  description: |
    kubectl-sentinel collects a structured, severity-ranked snapshot of cluster
    health across 15 dimensions (pods, workloads, events, jobs, PDBs, quotas,
    DNS, certs, and more). Output is text, JSON, or HTML.

    Rule-based classifications are reproducible for equivalent captured inputs
    and tool versions. The plugin makes no direct SaaS or LLM calls; kubectl
    contacts the selected Kubernetes API.
  caveats: |
    Requires Bash, kubectl, jq, and standard Unix utilities on your PATH.
    Linux is the currently validated platform.
  platforms:
    - selector:
        matchExpressions:
          - key: os
            operator: In
            values: [linux]
      {{addURIAndSha "https://github.com/GreenerPlatform/kubectl-sentinel/releases/download/{{ .TagName }}/kubectl-sentinel-{{ .TagName }}.tar.gz" .TagName }}
      bin: kubectl-sentinel
      files:
        - from: kubectl-sentinel
          to: .
        - from: LICENSE
          to: .
        - from: NOTICE
          to: .
